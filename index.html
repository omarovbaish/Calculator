<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Calculator</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="styles.css">
  </head>
<body>
<h1>Welcome to Calculator</h1>
<main> 
	<form class="set_precision">
	<label for="setting_precision">Set your precision</label>
	<input id="setting_precision" type="number" min="0" max="20" step="1" value="8">
	</form>
	<div class="calculator">
	<div class="first-line">
	<input class="input">
	<button id="backspace">✖</button>
	</div>
	<div class="main">
	<div class="special-operators">
	<button>AC</button>
	<button>√x</button>
	<button>%</button>
	</div>
	<div class="numbers">
		<button>7</button>
		<button>8</button>
		<button>9</button>
		<button>4</button>
		<button>5</button>
		<button>6</button>
		<button>1</button>
		<button>2</button>
		<button>3</button>
		<button id="zero">0</button>
		<button id="decimal">.</button>
		<button>+/-</button>
	</div>
	<div class="operators">
		<button>/</button>
		<button>*</button>
		<button>-</button>
		<button>+</button>
		<button>=</button>
	</div>
	</div>
	</div>
</main>
</body>
</html>
